<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 30 180 180" width="512" height="512">
  <defs>
    <linearGradient id="v1-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="v1-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="v1-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <g transform="translate(40, 25)">
    <!-- Base Ribbon/Book Pages -->
    <path d="M 30,150 Q 100,120 100,170 Q 100,120 170,150 L 170,130 Q 100,100 100,150 Q 100,100 30,130 Z" fill="url(#v1-grad2)" opacity="0.85"/>

    <!-- Stylized 'A' + Mortarboard Top -->
    <path d="M 100,20 L 165,60 L 100,100 L 35,60 Z" fill="url(#v1-grad1)" />
    <path d="M 50,70 L 100,155 L 150,70 L 128,70 L 100,120 L 72,70 Z" fill="url(#v1-grad1)" />

    <!-- Connected Community Nodes -->
    <circle cx="100" cy="50" r="7" fill="url(#v1-accent)" />
    <circle cx="45" cy="115" r="6" fill="url(#v1-accent)" />
    <circle cx="155" cy="115" r="6" fill="url(#v1-accent)" />

    <line x1="100" y1="50" x2="45" y2="115" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="100" y1="50" x2="155" y2="115" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="45" y1="115" x2="155" y2="115" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
</svg>
