[package]
name = "anyschool"
version = "0.1.0"
description = "AnySchool - Multi-tenant school management platform"
authors = ["AnySchool"]
edition = "2021"

[lib]
name = "anyschool_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
